        type: "number"
        format: "float"
        description: "Level of resistance in ohm(Ω).\n   minimum: 0,\n   maximum: 3.4028235e+38,\n   example: \"20.5\"."
      pressure:
        type: "number"
        format: "float"
        description: "Level of pressure in Kilopascal(kPa).\n   minimum: 0,\n   maximum: 3.4028235e+38,\n   example: \"30\"."
      distance:
        type: "number"
        format: "float"
        description: "Distance in Meter(m).\n   minimum: 0,\n   maximum: 3.4028235e+38,\n   example: \"30\"."
      capacitance:
        type: "number"
        format: "float"
        description: "Capacitance in Farad(F).\n   minimum: 0,\n   maximum: 3.4028235e+38,\n   example: \"20.5\"."
