swagger: "2.0"
info:
  title: "IoT Operations Partner API"
  description: "This is REST API definition for 3rd party containers running in Aruba IoT Gateway.\n\nThe container can read below environment variables to use the APIs:\n   | Environment Variable | Description                              | Example                       |\n   |----------------------|------------------------------------------|-------------------------------|\n   | APIGW_URL            | URL of the API Gateway                   | apigw.iot-gateway.svc         |\n   | APIKEY               | API key of Partner API                   | 6509461705ff704a6fa56d6b-0-1  |\n   | GATEWAY_ID           | ID of the data collector                 | 3326352892534583468           |\n   | GATEWAY_IP           | IP of the data collector                 | 10.48.3.35                    |\n   | GATEWAY_NAME         | Name of the data collector               | qa-scale-32                   |\n   | APP_WRITABLE_DIR     | The writable directory                   | /home/app/data                |\n   | APP_CERT_DIR         | The directory with uploaded certificates | /home/app/iotops-server-certs |\n   | APP_PV_DIR           | The persistent volume directory          | /home/app/pv                  |\n\nWhat is Hardware ID of each device type?\n- BLE: 6 bytes MAC address like \"aa:bb:cc:dd:ee:ff\"\n- Zigbee: 8 bytes MAC address like \"aa:bb:cc:dd:ee:ff:11:22\"\n- USB: AP generated global unique random identifier like \"c133a5075e35dd97bc25b75893c675b1\"\n- Secondary: N/A, device ID only\n\nFor device API with \"id\" parameter in URL path, it is \"Hardware ID\" by default.\nThere are two optional query parameters:\n- idType: ID_TYPE_HARDWARE_ID (default) or ID_TYPE_DEVICE_ID\n- deviceClass: required when idType is ID_TYPE_DEVICE_ID\n\nMost of APIs are using normal HTTP synchronous methods and respond a single result in JSON format. But some of them need to respond multiple asynchronous results and use HTTP JSON stream. Below is the list of APIs:\n- PUT /ble/cmd/connect: device connect\n- GET /ble/cmd/gattnotify: GATT notification\n- GET /ble/cmd/gattindicate: GATT indication\n\nNote:\n1. The mac in BLE devices is 6 bytes while in Zigbee is 8 bytes.\n2. The string(byte) means base64 encoded string in json.\n\nAll APIs are using normal HTTP status code. Below is the complete list of error responses:\n| Status Code | Description         | Reason                                                     | Handle                                                                 |\n| ----------- | ------------------- | ---------------------------------------------------------- | ---------------------------------------------------------------------- |\n| 400         | InvalidArgument     | Arguments in URL or request body is invalid.               | Check request parameters.                                              |\n| 401         | Unauthenticated     | The credentials are invalid.                               | Check API key.                                                         |\n| 403         | PermissionDenied    | You do not have permission to access this API.             | Check API permission.                                                  |\n| 404         | NotFound            | The resource does not exist. Or spelling mistakes in URL.  | Check URL and resource ID.                                             |\n| 409         | AlreadyExists       | The resource you are trying to create has already existed. | Check resource ID.                                                     |\n| 500         | Unknown or Internal | Error occurred inside the server.                          | Retry after some time. Or report bug to Aruba with the error messages. |\n| 503         | Unavailable         | The sever is starting or restarting.                       | Retry after some time. Or report bug to Aruba with the error messages. |\n| 504         | DeadlineExceeded    | The network issue or other environment fault occurred.     | Retry after some time. Or report bug to Aruba with the error messages. |"
  version: '3.1'
  contact:
    name: "Aruba iotops team"
    email: "wei.huang@hpe.com"
schemes:
- "http"
consumes:
- "application/json"
produces:
- "application/json"
paths:
  /api/v3/apps/info:
    post:
      summary: "Send app info"
      description: "Send app info\nRequired scope: context; permission: readonly"
      operationId: "AppManagerService_SendAppInfo"
      responses:
        "200":
          description: "A successful response."
          schema:
            $ref: "#/definitions/apiv3SendAppInfoResponse"
        default:
          description: "An unexpected error response."
          schema:
            $ref: "#/definitions/rpcStatus"
      parameters:
      - name: "body"
        in: "body"
        required: true
        schema:
          $ref: "#/definitions/apiv3SendAppInfoRequest"
      tags:
      - "App"
  /api/v3/aps:
    get:
      summary: "Get AP list"
      description: "Required scope: context; permission: readonly"
      operationId: "IngestionService_GetAPs"
      responses:
        "200":
          description: "A successful response."
          schema:
            $ref: "#/definitions/v3GetAPsResponse"
        default:
          description: "An unexpected error response."
          schema:
            $ref: "#/definitions/rpcStatus"
      tags:
      - "Infra"
  /api/v3/aps/{apMac}:
    get:
      summary: "Get AP detailed info"
      description: "Required scope: context; permission: readonly"
      operationId: "IngestionService_GetAPInfo"
      responses:
        "200":
          description: "A successful response."
          schema:
            $ref: "#/definitions/v3GetAPInfoResponse"
        default:
          description: "An unexpected error response."
          schema:
            $ref: "#/definitions/rpcStatus"
      parameters:
      - name: "apMac"
        in: "path"
        required: true
        type: "string"
      tags:
      - "Infra"
  /api/v3/beacon/{radioMac}:
    post:
      summary: "Set beacon config"
      description: "Set beacon config to the radio.\nRequired scope: beacon; permission: readwrite."
      operationId: "IngestionService_SetBeaconConfig"
      responses:
        "200":
          description: "A successful response."
          schema:
            $ref: "#/definitions/apiv3SetBeaconConfigResponse"
        default:
          description: "An unexpected error response."
          schema:
            $ref: "#/definitions/rpcStatus"
      parameters:
      - name: "radioMac"
        in: "path"
        required: true
        type: "string"
      - name: "body"
        in: "body"
        required: true
        schema:
          type: "object"
          properties:
            apMac:
              type: "string"
            beaconConfig:
              $ref: "#/definitions/apiv3BeaconConfig"
      tags:
      - "Infra"
  /api/v3/ble/cmd/authentication/{id}:
    post:
      summary: "BLE GATT Authentication"
      description: "BLE GATT Authentication.\n\nRequired scope: gatt; permission: readwrite\n\nThis API will do authentication after gatt connection established."
      operationId: "CmdGatewayService_GattAuthentication"
      responses:
        "200":
          description: "A successful response."
          schema:
            $ref: "#/definitions/v3GattAuthenticationResponse"
        default:
          description: "An unexpected error response."
          schema:
            $ref: "#/definitions/rpcStatus"
      parameters:
      - name: "id"
        in: "path"
        required: true
        type: "string"
      - name: "authenticationData"
        in: "body"
        required: true
        schema:
          $ref: "#/definitions/GattAuthenticationRequestAuthenticationData"
      - name: "idType"
        description: " - ID_TYPE_HARDWARE_ID: Id type hardwareId\n - ID_TYPE_DEVICE_ID: Id type deviceId"
        in: "query"
        required: false
        type: "string"
        enum:
        - "ID_TYPE_DEVICE_ID"
      - name: "deviceClass"
        in: "query"
        required: false
        type: "string"
      tags:
      - "BLE GATT"
  /api/v3/ble/cmd/connect/{id}:
    delete:
      summary: "BLE GATT Disconnect"
      description: "BLE GATT Disconnect. Required scope: gatt; permission: readonly"
      operationId: "CmdGatewayService_GattDisconnect"
      responses:
        "200":
          description: "A successful response."
          schema:
            $ref: "#/definitions/v3GattDisconnectResponse"
        default:
          description: "An unexpected error response."
          schema:
            $ref: "#/definitions/rpcStatus"
      parameters:
      - name: "id"
        description: "device mac"
        in: "path"
        required: true
        type: "string"
      - name: "idType"
        description: " - ID_TYPE_HARDWARE_ID: Id type hardwareId\n - ID_TYPE_DEVICE_ID: Id type deviceId"
        in: "query"
        required: false
        type: "string"
        enum:
        - "ID_TYPE_DEVICE_ID"
      - name: "deviceClass"
        in: "query"
        required: false
        type: "string"
      - name: "timeout"
        description: "AP air-time timeout in seconds; default: 15"
        in: "query"
        required: false
        type: "integer"
        format: "int32"
      tags:
      - "BLE GATT"
    put:
      summary: "BLE GATT Connect"
      description: "BLE GATT Connect. Required scope: gatt; permission: readonly\n\nThe call to this API is suggested to be open during the device connection lifecycle in order to receive continuous device status message.\n\nThe response of the API will be:\n1. actionResult if connection to device succeeded or failed.\n2. The Service and Characteristic Discovery result.\n3. Device status update like disconnected or MTU update.\n\nThis API uses JSON stream.\nMinInterval, maxInterval, slaveLatency and supervisionTimeout parameters must be provided together."
      operationId: "CmdGatewayService_GattConnect"
      responses:
        "200":
          description: "A successful response.(streaming responses)"
          schema:
            type: "object"
            properties:
              result:
                $ref: "#/definitions/v3GattConnectResponse"
              error:
                $ref: "#/definitions/rpcStatus"
            title: "Stream result of v3GattConnectResponse"
        default:
          description: "An unexpected error response."
          schema:
            $ref: "#/definitions/rpcStatus"
      parameters:
      - name: "id"
        description: "device mac"
        in: "path"
        required: true
        type: "string"
      - name: "idType"
        description: " - ID_TYPE_HARDWARE_ID: Id type hardwareId\n - ID_TYPE_DEVICE_ID: Id type deviceId"
        in: "query"
        required: false
        type: "string"
        enum:
        - "ID_TYPE_DEVICE_ID"
      - name: "deviceClass"
        in: "query"
        required: false
        type: "string"
      - name: "timeout"
        description: "AP air-time timeout in seconds; default: 15"
        in: "query"
        required: false
        type: "integer"
        format: "int32"
      - name: "apMac"
        description: "specific AP mac"
        in: "query"
        required: false
        type: "string"
      - name: "skipDiscovery"
        description: "skip discovery"
        in: "query"
        required: false
        type: "boolean"
      - name: "minInterval"
        description: "Minimum connection interval permitted: [6, 3200] in units of 1.25 ms\n minium: 6,\n maximum: 3200."
        in: "query"
        required: false
        type: "integer"
        format: "int64"
      - name: "maxInterval"
        description: "Maximum connection interval permitted: [6, 3200] in units of 1.25 ms\n minium: 6,\n maximum: 3200."
        in: "query"
        required: false
        type: "integer"
        format: "int64"
      - name: "slaveLatency"
        description: "Slave latency permitted, in connection events: [0, 500)\n minium: 0,\n maximum: 499."
        in: "query"
        required: false
        type: "integer"
        format: "int64"
      - name: "supervisionTimeout"
        description: "Supervision timeout permitted: [10, 3200] in units of 10 ms\n minium: 10,\n maximum: 3200."
        in: "query"
        required: false
        type: "integer"
        format: "int64"
      tags:
      - "BLE GATT"
  /api/v3/ble/cmd/encryption/{id}:
    put:
      summary: "BLE GATT Encryption"
      description: "BLE GATT Encryption.\n\nRequired scope: gatt; permission: readwrite\n\nThis API will use the bondingKey to encrypt the data of gatt connection."
