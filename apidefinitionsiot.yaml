  /api/v3/ble/cmd/gattatomic/{id}:
    get:
      summary: "BLE GATT AtomicRead"
      description: "BLE GATT AtomicRead. Required scope: gatt; permission: readonly\n\nsimple REST api that return the value of a GATT characteristic (equivalent to connect-gattRead-disconnect)\nEither svcid/charid or valuehandle parameters must be provided."
      operationId: "CmdGatewayService_GattAtomicRead"
