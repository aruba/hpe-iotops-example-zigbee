    - "BLE_FRAME_TYPE_EXTENDED_NONCONNECTABLE_NONSCANNABLE_UNDIRECTED"
    - "BLE_FRAME_TYPE_EXTENDED_NONCONNECTABLE_NONSCANNABLE_DIRECTED"
    description: "- BLE_FRAME_TYPE_ADV_UNSPECIFIED: Frame type unspecified\n - BLE_FRAME_TYPE_ADV_IND: Connectable undirected advertising which can be connected to by any BLE central.\n - BLE_FRAME_TYPE_ADV_DIRECT_IND: Connectable directed advertising which can be connected to by one specific Central.\n - BLE_FRAME_TYPE_ADV_NONCONN_IND: Non-connectable undirected advertising which cannot be connected to and cannot respond to a scan request.\n - BLE_FRAME_TYPE_SCAN_RSP: The scan response packet containing any additional info sent by the peripheral.\n - BLE_FRAME_TYPE_ADV_SCAN_IND: Scannable undirected advertising which cannot be connected to but which can respond to a scan request.\n - BLE_FRAME_TYPE_EXTENDED_CONNECTABLE_NONSCANNABLE_UNDIRECTED: Connectable non-scannable undirected advertising events using extended advertising PDUs.\n - BLE_FRAME_TYPE_EXTENDED_CONNECTABLE_NONSCANNABLE_DIRECTED: Connectable non-scannable directed advertising events using extended advertising PDUs.\n - BLE_FRAME_TYPE_EXTENDED_NONCONNECTABLE_SCANNABLE_UNDIRECTED: Non-connectable scannable undirected advertising events using extended advertising PDUs. @note Only scan response data is supported.\n - BLE_FRAME_TYPE_EXTENDED_NONCONNECTABLE_SCANNABLE_DIRECTED: Non-connectable scannable directed advertising events using extended advertising PDUs. @note Only scan response data is supported.\n - BLE_FRAME_TYPE_EXTENDED_NONCONNECTABLE_NONSCANNABLE_UNDIRECTED: Non-connectable non-scannable undirected advertising events using extended advertising PDUs.\n - BLE_FRAME_TYPE_EXTENDED_NONCONNECTABLE_NONSCANNABLE_DIRECTED: Non-connectable non-scannable directed advertising events using extended advertising PDUs."
    title: "BLE frame type"
