        format: "int32"
      - name: "valueHandle"
        description: "value handle"
        in: "query"
        required: false
        type: "integer"
        format: "int64"
      tags:
      - "BLE GATT"
    post:
      summary: "BLE GATT Write"
      description: "BLE GATT Write. Required scope: gatt; permission: readwrite\nBy default, GATT write with response\nEither svcid/charid or valuehandle parameters must be provided."
      operationId: "CmdGatewayService_GattWrite"
      responses:
        "200":
          description: "A successful response."
          schema:
            $ref: "#/definitions/v3GattWriteResponse"
        default:
          description: "An unexpected error response."
          schema:
            $ref: "#/definitions/rpcStatus"
      parameters:
      - name: "id"
        description: "device mac"
        in: "path"
        required: true
        type: "string"
      - name: "value"
        description: "value to write"
        in: "body"
        required: true
        schema:
          type: "string"
          format: "byte"
          example: "YgAAAAAA"
          required:
          - "value"
      - name: "idType"
        description: " - ID_TYPE_HARDWARE_ID: Id type hardwareId\n - ID_TYPE_DEVICE_ID: Id type deviceId"
        in: "query"
