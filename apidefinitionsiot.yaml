definitions:
  AccelerometerAccelStatus:
    type: "string"
    enum:
    - "ACCEL_STATUS_OK"
    - "ACCEL_STATUS_OUT_OF_RANGE"
    - "ACCEL_STATUS_THRESHOLD1"
    - "ACCEL_STATUS_THRESHOLD2"
    description: "- ACCEL_STATUS_UNSPECIFIED: unspecified status\n - ACCEL_STATUS_OK: status ok\n - ACCEL_STATUS_OUT_OF_RANGE: status out-of-range\n - ACCEL_STATUS_THRESHOLD1: status threshold1\n - ACCEL_STATUS_THRESHOLD2: status threshold2"
    title: "accelerometer status types"
  AggregationAggregationType:
    type: "string"
    enum:
    - "AGGREGATION_TYPE_AVERAGE"
    - "AGGREGATION_TYPE_LATEST"
    - "AGGREGATION_TYPE_MAX"
  BeaconCustomBeacon:
    type: "object"
    properties:
      payload:
        type: "string"
        format: "byte"
        title: "Custom advertisement payload bytes"
    title: "Custom beacon"
  DeviceDataBLEBeacons:
    type: "object"
    properties:
      ibeacon:
        $ref: "#/definitions/commonv1IBeacon"
      eddystone:
        $ref: "#/definitions/v1Eddystone"
  EddystoneEddyEID:
    type: "object"
    properties:
      calibratedPower:
        type: "integer"
        format: "int32"
        description: "The Ranging Data is the Tx power in dBm emitted by the beacon at 0 meters.\n     minimum: -100,\n     maximum: 20,\n     example: \"-5\"."
      eddystoneEidEid:
        type: "string"
        format: "byte"
        description: "8-byte Ephemeral Identifier.\n    max_length: 8,\n    min_length: 8."
    title: "Eddystone-EID"
  EddystoneEddyTLM:
    type: "object"
    properties:
      version:
        type: "integer"
        format: "int64"
        description: "TLM version allows for future development of this frame type. At present the value must be 0x00\n example: \"1\"."
      batteryVoltage:
        type: "number"
        format: "float"
        description: "Battery voltage is the current battery charge in Volt.\n     minimum: 0,\n     example: \"100\"."
      beaconTemperature:
        type: "number"
        format: "float"
        description: "Beacon temperature is the temperature in degrees Celsius sensed by the beacon.\n example: \"18.5\"."
      advCount:
        type: "string"
        format: "uint64"
        description: "the running count of advertisement frames of all types emitted by the beacon since power-up or reboot.\n     minimum: 0,\n     example: \"100\"."
      secCount:
        type: "string"
        format: "uint64"
        description: "a 0.1 second resolution counter that represents time since beacon power-up or reboot.\n     minimum: 0,\n     example: \"200\"."
    title: "Eddystone-TLM"
  EddystoneEddyUID:
    type: "object"
    properties:
      calibratedPower:
        type: "integer"
        format: "int32"
        description: "The Ranging Data is the Tx power in dBm emitted by the beacon at -1 meters.\n     minimum: -100,\n     maximum: 20,\n     example: \"-5\"."
      eddystoneUidNid:
        type: "string"
        format: "byte"
        description: "The 9-byte Namespace ID component is unique self-assigned beacon ID namespace.\n     max_length: 9,\n     min_length: 9."
      eddystoneUidBid:
        type: "string"
        format: "byte"
        description: "The 5-byte Instance ID component is unique within the namespace.\n     max_length: 5,\n     min_length: 5."
    title: "Eddystone UID"
  EddystoneEddyURL:
    type: "object"
    properties:
      calibratedPower:
        type: "integer"
        format: "int32"
        description: "The Ranging Data is the Tx power in dBm emitted by the beacon at 0 meters.\n     minimum: -100,\n     maximum: 20,\n     example: \"-5\"."
      eddystoneUrlPrefix:
        type: "integer"
        format: "int64"
        description: "The URL Scheme Prefix byte defines the identifier scheme, an optional prefix and how the remainder of the URL is encoded.\n     minimum: 0,\n     maximum: 3."
      eddystoneUrlEncodedUrl:
        type: "string"
        format: "byte"
        description: "a URL using a compressed encoding format.\n     min_length: 1,\n     max_length: 17."
    title: "Eddystone-URL"
  FilterFilterType:
    type: "string"
    enum:
    - "FILTER_TYPE_MIN_RSSI"
    - "FILTER_TYPE_IBEACON_UUID"
  GattAuthenticationRequestAuthenticationData:
    type: "object"
    properties:
      method:
        $ref: "#/definitions/v3AuthenticationMethod"
      bonding:
        type: "boolean"
        title: "Whether bonding is enabled, which also depends on peer's bond"
      passKey:
        type: "string"
        title: "Whether passkey is used. Passkey is  6 numeric digits (‘0’ - ‘9’)\n‘0’ will be prefixed if length of passkey is less than 6\nRequired when method is 'passkey' or 'lescPasskey'"
      keyOob:
        type: "string"
        format: "byte"
        title: "16-bytes hexadecimal key. 0 will be prefixed if its length is less than 16\nThis is required when method is 'oob' or 'lescOob'"
      keyOwn:
        type: "string"
        format: "byte"
        title: "16-bytes hexadecimal key. 0 will be prefixed if its length is less than 16\nThis is required when lesc is used, and peer uses the server's keyOwn or passkey is used"
  GattConnectResponseConnUpdate:
    type: "object"
    properties:
      mtuValue:
        type: "integer"
        format: "int64"
        title: "The negotiated MTU Value between BLE central and peripheral"
  GattEncryptionRequestEncryptionData:
    type: "object"
    properties:
      bondingKey:
        type: "string"
        format: "byte"
        title: "Encryption key which is generated when bonding is enabled for pairing"
  GetRadiosRequestFirmwareType:
    type: "string"
    enum:
    - "FIRMWARE_TYPE_ARUBA"
    - "FIRMWARE_TYPE_SDR"
  GetSecondaryDeviceListResponseSecondaryDevice:
    type: "object"
    properties:
      deviceId:
        type: "string"
      deviceClass:
        type: "array"
        items:
          type: "string"
  GetTPDataRequestAggregation:
    type: "object"
    properties:
      reportInterval:
        type: "string"
        format: "int64"
      rssiAggregation:
        $ref: "#/definitions/AggregationAggregationType"
  GetTPDataRequestSubscription:
    type: "object"
    properties:
      type:
        $ref: "#/definitions/SubscriptionSubscriptionType"
      match:
        type: "string"
  InputsSwitchState:
    type: "string"
    enum:
    - "SWITCH_STATE_UNKNOWN"
    - "SWITCH_STATE_ON"
    - "SWITCH_STATE_OFF"
    description: "- SWITCH_STATE_UNSPECIFIED: switch statue unspecified\n - SWITCH_STATE_UNKNOWN: switch state unknown\n - SWITCH_STATE_ON: switch on\n - SWITCH_STATE_OFF: switch off"
    title: "switch state definition"
  IotRadioInventoryIotRadioFirmware:
    type: "string"
    enum:
    - "IOT_RADIO_FIRMWARE_ARUBA"
    - "IOT_RADIO_FIRMWARE_SDR"
    description: "- IOT_RADIO_FIRMWARE_UNSPECIFIED: UNSPECIFIED\n - IOT_RADIO_FIRMWARE_ARUBA: Radio firmware ARUBA\n - IOT_RADIO_FIRMWARE_SDR: Radio firmware SDR"
    title: "Hardware type of the Aruba radio"
  IotRadioInventoryIotRadioType:
    type: "string"
    enum:
    - "IOT_RADIO_TYPE_GEN1"
    - "IOT_RADIO_TYPE_GEN2"
    - "IOT_RADIO_TYPE_GEN3"
    description: "- IOT_RADIO_TYPE_UNSPECIFIED: UNSPECIFIED\n - IOT_RADIO_TYPE_GEN1: gen1 is capable of BLE 4.0 only (3xx series minus 303P)\n - IOT_RADIO_TYPE_GEN2: gen2 is capable of BLE 5.0 and Zigbee  (303P, 5xx and 6xx series)\n - IOT_RADIO_TYPE_GEN3: gen3 is dual radio brcm solution  (7xx series)"
    title: "Indicates type of the IoT radio HW"
  IotRadioStateBleBleConsole:
    type: "string"
    enum:
    - "BLE_CONSOLE_OFF"
    - "BLE_CONSOLE_ON"
    - "BLE_CONSOLE_DYNAMIC"
