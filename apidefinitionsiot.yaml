  commonv1Location:
    type: "object"
    properties:
      latitude:
        type: "number"
        format: "double"
        description: "latitude These must be specified as degrees in the WGS84 coordinate system."
      latitudeUncertainty:
        type: "number"
        format: "double"
        description: "latitude uncertainty The uncertainty in the latitude measurement, measured in degrees. It indicates the possible error range in the latitude value."
      longitude:
        type: "number"
        format: "double"
        description: "longitude These must be specified as degrees in the WGS84 coordinate system."
      longitudeUncertainty:
        type: "number"
        format: "double"
        description: "longitude uncertainty  The uncertainty in the longitude measurement, measured in degrees. It indicates the possible error range in the longitude value."
      unitsPerMeter:
        type: "number"
        format: "float"
        description: "units per meter. Default value is 1."
      x:
        type: "number"
        format: "float"
        description: "x is in meters, These indicate the x-distance from the origin point (0, 0) which is the top, left corner of the floorplan."
      "y":
        type: "number"
        format: "float"
        description: "y is in meters, These indicate the y-distance from the origin point (0, 0) which is the top, left corner of the floorplan."
      floorId:
        type: "string"
        description: "floor id A string representing the identifier of the floor within the building. This helps in distinguishing between different floors in a multi-story building."
      floorNumber:
        type: "number"
        format: "float"
        description: "floor number These must be specified as floors above the groundfloor in a building. 0 is the groundfloor. Positive numbers are above. Negative numbers can be used to indicate basement floors. Non-integers can be used to indicate in-between levels such as mezzanine levels or partial floors."
      elevation:
        type: "number"
        format: "double"
        description: "elevation the value will be same with altitude, measured in meters above 0 in the WGS84 coordinate system."
      elevationUncertainty:
        type: "number"
        format: "double"
        description: "elevation uncertainty the value will be same with altitude_uncertainty, measured in meters."
      xUncertainty:
        type: "number"
        format: "float"
        description: "x uncertainty The uncertainty in the x-coordinate measurement, measured in meters. It indicates the possible error range in the x-coordinate value."
      yUncertainty:
        type: "number"
        format: "float"
        description: "y uncertainty The uncertainty in the y-coordinate measurement, measured in meters. It indicates the possible error range in the y-coordinate value."
    description: "for self reported location, the location can be in WGS84 or floorplan coordinate system\nthe valid input will be:\n GeoLocation\n 1. latitude, longitude\n 2. latitude, longitude, latitudeUncertainty, longitudeUncertainty\n 3. latitude, longitude, altitude\n 4. latitude, longitude, altitude, altitudeUncertainty\n 5. latitude, longitude, latitudeUncertainty, longitudeUncertainty, altitude, altitudeUncertainty\n 6. latitude, longitude, floorNumber\n floorLocation\n 1. x, y, floorId\n 2. x, y, xUncertainty, yUncertainty, floorId"
    title: "Location"
