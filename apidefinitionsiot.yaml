  USBIfaceAttrs:
    type: "object"
    properties:
      authorized:
        type: "boolean"
        title: "Interface authorized"
      bInterfaceNumber:
        type: "integer"
        format: "int64"
        title: "(b_interface_number)bInterfaceNumber indicates the index of the interface descriptor.\nThis should be zero based, and incremented once for each new interface descriptor.\n(usb interface id (0...n) → iface id)  (SE map bInterfaceNumber to iface id)  (set it in appbundle)"
      bAlternateSetting:
        type: "integer"
        format: "int64"
        description: "(b_alternate_setting)bAlternativeSetting can be used to specify alternative interfaces.\nThese alternative interfaces can be selected with the Set Interface request.\nbInterfaceNumber and bAlternateSetting contain index values that the host uses to activate the interface and one of its alternate settings.\nFor activation, an application or a driver specifies the index value in the function call.\nBased on that information, the USB driver stack then builds a standard control request (SET INTERFACE) and sends it to the device."
      bInterfaceClass:
        type: "integer"
        format: "int64"
        description: "Class Code (Assigned by USB Org)\nbInterfaceClass, bInterfaceSubClass and bInterfaceProtocol can be used to specify supported classes (e.g. HID, communications, mass storage etc.)\nThis allows many devices to use class drivers preventing the need to write specific drivers for your device."
      bInterfaceSubClass:
        type: "integer"
        format: "int64"
        title: "Code (Assigned by USB Org)"
      bInterfaceProtocol:
        type: "integer"
        format: "int64"
        title: "Protocol Code (Assigned by USB Org)"
      bNumEndpoints:
        type: "integer"
        format: "int64"
        title: "Number of endpoints used by the interface"
    title: "interface attributes\nfor example:\nbInterfaceNumber:     0x00\nbAlternateSetting:    0x00\nbInterfaceClass:      0x0E\nbInterfaceSubClass:   0x02\nbInterfaceProtocol:   0x00"
  USBIfaceClass:
    type: "string"
    enum:
    - "CLASS_TTY"
    - "CLASS_NET"
    description: "- CLASS_UNSPECIFIED: Usually, it means current interface isn't driven successfully or not supported yet.\n - CLASS_TTY: TTY based\n - CLASS_NET: Ethernet based"
    title: "Interface Class"
