      - name: "deviceClass"
        in: "query"
        required: false
        type: "string"
      - name: "svcid"
        description: "service uuid (in hex format)"
        in: "query"
        required: false
        type: "string"
      - name: "charid"
        description: "characteristic uuid (in hex format)"
        in: "query"
        required: false
        type: "string"
      - name: "timeout"
