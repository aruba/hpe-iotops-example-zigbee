        description: "device mac"
        in: "path"
        required: true
        type: "string"
      - name: "idType"
        description: " - ID_TYPE_HARDWARE_ID: Id type hardwareId\n - ID_TYPE_DEVICE_ID: Id type deviceId"
        in: "query"
        required: false
        type: "string"
        enum:
        - "ID_TYPE_DEVICE_ID"
      - name: "deviceClass"
        in: "query"
        required: false
        type: "string"
      - name: "svcid"
        description: "service uuid (in hex format)"
        in: "query"
        required: false
        type: "string"
      - name: "charid"
        description: "characteristic uuid (in hex format)"
        in: "query"
        required: false
        type: "string"
      - name: "timeout"
        description: "AP air-time timeout in seconds; default: 15"
        in: "query"
        required: false
        type: "integer"
        format: "int32"
      - name: "apMac"
        description: "specific AP mac"
        in: "query"
        required: false
        type: "string"
      - name: "valueHandle"
        description: "value handle"
        in: "query"
        required: false
        type: "integer"
        format: "int64"
      tags:
      - "BLE GATT"
    post:
      summary: "BLE GATT AtomicWrite"
      description: "BLE GATT AtomicWrite. Required scope: gatt; permission: readwrite\n\nsimple REST api that writes a value to a GATT characteristic (equivalent to connect-gattWrite-disconnect)\nEither svcid/charid or valuehandle parameters must be provided.\nBy default, GATT write with response"
      operationId: "CmdGatewayService_GattAtomicWrite"
