        type: "string"
        enum:
        - "ID_TYPE_DEVICE_ID"
      - name: "deviceClass"
        in: "query"
        required: false
        type: "string"
      - name: "svcid"
        description: "service uuid (in hex format)"
        in: "query"
        required: false
        type: "string"
      - name: "charid"
